[project]
name = "arraypattern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "plotly>=7.0.0",
    "scipy>=1.18.1",
    "sionna-rt>=2.1.0",
]

[project.scripts]
arraypattern = "arraypattern:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
